<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="תנועת חמש אצבעות — מפתחים את הדור הבא של מנהיגי ישראל דרך מצוינות ערכית" />
    <title>חמש אצבעות — תנועה ישראלית</title>

    <!-- Open Graph / WhatsApp / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="חמש אצבעות - מצוינות ערכית" />
    <meta property="og:description" content="תנועה חינוכית-חברתית הפועלת ברחבי הארץ לפיתוח הדור הבא." />
    <meta property="og:image" content="/new_link_logo.png" />
    <meta property="og:image:width" content="1672" />
    <meta property="og:image:height" content="941" />
    <meta property="og:locale" content="he_IL" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="חמש אצבעות - מצוינות ערכית" />
    <meta name="twitter:description" content="תנועה חינוכית-חברתית הפועלת ברחבי הארץ לפיתוח הדור הבא." />
    <meta name="twitter:image" content="/new_link_logo.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700;900&family=Heebo:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- HubSpot tracking. Sets the `hubspotutk` visitor cookie, which the contact
         forms pass along as context.hutk so each submission attaches to a real
         visitor session instead of landing as "no cookie was found".
         Lives here (not in main.jsx) because scripts/prerender.mjs clones this
         file into every route, and dashboard.html is a separate entry — so the
         staff dashboard stays untracked, like the page-view beacon. -->
    <script type="text/javascript" id="hs-script-loader" async defer src="//js-eu1.hs-scripts.com/26835159.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

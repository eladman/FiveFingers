<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>חמש אצבעות — Hero (Messi)</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          orange: '#ff8714',
          'orange-ink': '#b35600',
          navy: '#0d1b4b',
          'navy-deep': '#081028',
          'navy-light': '#1e3578',
          surface: '#fafaf8',
          'surface-2': '#f7f5f2',
        },
        fontFamily: {
          sans: ['Heebo', 'Inter', 'sans-serif'],
        },
        transitionTimingFunction: {
          brand: 'cubic-bezier(0.25,0.46,0.45,0.94)',
        },
      },
    },
  }
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<style>
  :root {
    --orange: #ff8714;
    --orange-lift: #ffa347;
    --orange-deep: #e56f00;
    --ease-brand: cubic-bezier(0.25, 0.46, 0.45, 0.94);
    --t-base: 240ms;
  }

  @font-face {
    font-family: 'RagMarom';
    src: url('./fonts/rag-marom-2.1.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Heebo', 'Inter', sans-serif;
    background: var(--navy-deep, #081028);
  }

  .font-ragmarom { font-family: 'RagMarom', sans-serif; }

  /* Ken Burns — slow zoom/pan on the active hero slide */
  @keyframes kenBurns {
    from { transform: scale(1.0); }
    to   { transform: scale(1.12); }
  }
  .ken-burns { animation: kenBurns 7s ease-out forwards; }

  @keyframes scrollBounce {
    0%, 100% { transform: translateY(0) translateX(-50%); }
    50%      { transform: translateY(8px) translateX(-50%); }
  }
  .scroll-indicator { animation: scrollBounce 1.8s ease-in-out infinite; }

  /* Primary CTA — "Sheen Sweep" */
  .btn-cta {
    background: linear-gradient(180deg, var(--orange-lift), var(--orange-deep));
    box-shadow:
      0 8px 22px rgba(255, 135, 20, 0.38),
      inset 0 1px 0 rgba(255, 255, 255, 0.40);
    transition: box-shadow var(--t-base) var(--ease-brand),
                transform 300ms var(--ease-brand);
  }
  .btn-cta:hover {
    box-shadow:
      0 12px 30px rgba(255, 135, 20, 0.50),
      inset 0 1px 0 rgba(255, 255, 255, 0.45);
  }
  .btn-sheen {
    position: absolute;
    top: 0; bottom: 0;
    width: 60%;
    left: -85%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.50), transparent);
    transform: skewX(-18deg);
    transition: left 600ms var(--ease-brand);
    pointer-events: none;
  }
  .group:hover .btn-sheen { left: 130%; }

  .btn-glow { animation: emberHalo 2.4s var(--ease-brand) infinite; }
  @keyframes emberHalo {
    0%, 100% { filter: drop-shadow(0 0 6px rgba(255, 135, 20, 0.35)); }
    50%      { filter: drop-shadow(0 0 20px rgba(255, 135, 20, 0.65)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn-glow { animation: none; filter: drop-shadow(0 0 10px rgba(255, 135, 20, 0.45)); }
    .btn-sheen { transition: none; }
  }
</style>
</head>
<body>

<section
  id="home"
  class="relative w-full min-h-[100dvh] overflow-hidden flex items-center justify-center"
>
  <!-- Background slideshow -->
  <div class="absolute inset-0 overflow-hidden">
    <div class="hero-bg absolute left-0 right-0" style="top:-8%; height:116%; will-change: transform;">
      <img class="hero-img absolute inset-0 w-full h-full object-cover" src="./messi/messi_1.webp" alt="" style="opacity:1; transition: opacity 1.2s ease-in-out, transform 1.2s ease-out; will-change: opacity, transform;" loading="eager" />
      <img class="hero-img absolute inset-0 w-full h-full object-cover" src="./messi/messi_2.webp" alt="" style="opacity:0; transition: opacity 1.2s ease-in-out, transform 1.2s ease-out; will-change: opacity, transform;" loading="lazy" />
      <img class="hero-img absolute inset-0 w-full h-full object-cover" src="./messi/messi_3.jpeg" alt="" style="opacity:0; transition: opacity 1.2s ease-in-out, transform 1.2s ease-out; will-change: opacity, transform;" loading="lazy" />
      <img class="hero-img absolute inset-0 w-full h-full object-cover" src="./messi/messi_4.jpg" alt="" style="opacity:0; transition: opacity 1.2s ease-in-out, transform 1.2s ease-out; will-change: opacity, transform;" loading="lazy" />
    </div>
    <!-- Warm-tone color grade -->
    <div class="absolute inset-0 bg-orange/10 mix-blend-multiply"></div>
    <!-- Dark scrim for text legibility -->
    <div class="absolute inset-0 bg-black/50"></div>
    <!-- Neutral depth gradient -->
    <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/10 to-transparent"></div>
    <!-- Deepens on scroll-out -->
    <div class="hero-scrim absolute inset-0 bg-black" style="opacity:0;"></div>
  </div>

  <!-- Content -->
  <div class="hero-content relative z-10 w-full max-w-6xl mx-auto px-8 md:px-16 text-center select-none" style="will-change: transform, opacity, filter;">
    <h1
      class="mb-0 flex items-center justify-center gap-[0.25em] text-white tracking-tight"
      style="font-family:'RagMarom', sans-serif; font-size: clamp(3rem, 9vw, 9.5rem); line-height: 0.95; text-shadow: 0 4px 32px rgba(0,0,0,0.95), 0 0 60px rgba(0,0,0,0.8);"
    >
      <span class="hero-word-1"><span id="word-1"></span></span>
      <span class="hero-word-2"><span id="word-2"></span></span>
    </h1>

    <div
      class="hero-accent mx-auto mt-5 md:mt-7 rounded-full bg-orange"
      style="height:3px; width: clamp(8rem, 22vw, 22rem); transform-origin:center;"
    ></div>

    <p
      class="hero-subtitle text-orange mt-5 md:mt-7"
      style="font-family:'RagMarom', sans-serif; font-size: clamp(1.6rem, 4.5vw, 4.5rem); text-shadow: 0 2px 20px rgba(0,0,0,0.9);"
    >
      מצוינות ערכית
    </p>

    <div class="flex flex-wrap gap-4 justify-center mt-10 md:mt-14">
      <button
        type="button"
        class="hero-cta group relative overflow-hidden inline-flex items-center justify-center font-bold rounded-full whitespace-nowrap transition-transform duration-300 ease-brand active:scale-[0.97] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-orange btn-cta text-white px-10 py-4 text-lg gap-2.5"
        onmouseenter="this.style.transform='scale(1.04)'"
        onmouseleave="this.style.transform='scale(1)'"
      >
        <span aria-hidden="true" class="btn-sheen"></span>
        <span class="relative">הצטרפו אלינו</span>
      </button>

      <a
        href="#features"
        class="hero-cta group relative overflow-hidden inline-flex items-center justify-center font-bold rounded-full whitespace-nowrap transition-transform duration-300 ease-brand active:scale-[0.97] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-white bg-transparent text-white/70 hover:text-white border border-white/20 hover:border-white/50 px-10 py-4 text-lg gap-2.5"
        onmouseenter="this.style.transform='scale(1.04)'"
        onmouseleave="this.style.transform='scale(1)'"
      >
        <span aria-hidden="true" class="absolute inset-0 bg-white/15 translate-y-full group-hover:translate-y-0 transition-transform duration-300 rounded-full"></span>
        <span class="relative">גלו עוד</span>
      </a>
    </div>
  </div>

  <!-- Scroll indicator -->
  <div class="scroll-indicator absolute left-1/2 -translate-x-1/2 z-10" style="bottom: max(2rem, env(safe-area-inset-bottom, 2rem));">
    <div class="w-6 h-10 rounded-full border-2 border-white/25 flex items-start justify-center pt-2">
      <div class="w-1 h-2.5 bg-white/50 rounded-full"></div>
    </div>
  </div>
</section>

<!-- Spacer so the scroll-out parallax is visible -->
<div style="height:60vh; background:#081028;"></div>

<script>
  gsap.registerPlugin(ScrollTrigger)

  // Split headline words into per-char spans, matching SplitText
  function splitText(el, text) {
    ;[...text].forEach(ch => {
      const span = document.createElement('span')
      span.className = 'hero-char'
      span.style.display = 'inline-block'
      span.style.willChange = 'transform, opacity, filter'
      span.textContent = ch
      el.appendChild(span)
    })
  }
  splitText(document.getElementById('word-1'), 'חמש')
  splitText(document.getElementById('word-2'), 'אצבעות')

  // Intro timeline
  const tl = gsap.timeline()
  tl.fromTo('.hero-word-1 .hero-char',
    { y: 55, opacity: 0, filter: 'blur(14px)' },
    { y: 0, opacity: 1, filter: 'blur(0px)', stagger: 0.09, duration: 0.95, ease: 'power3.out' },
    0.2)
  tl.fromTo('.hero-word-2 .hero-char',
    { y: 55, opacity: 0, filter: 'blur(14px)' },
    { y: 0, opacity: 1, filter: 'blur(0px)', stagger: 0.06, duration: 0.95, ease: 'power3.out' },
    '-=0.52')
  tl.fromTo('.hero-accent',
    { scaleX: 0, opacity: 0 },
    { scaleX: 1, opacity: 1, duration: 0.3, ease: 'power2.inOut' },
    '-=0.1')
  tl.fromTo('.hero-subtitle',
    { y: 16, opacity: 0 },
    { y: 0, opacity: 1, duration: 0.35, ease: 'power2.out' })
  tl.fromTo('.hero-cta',
    { y: 12, opacity: 0 },
    { y: 0, opacity: 1, stagger: 0.07, duration: 0.3, ease: 'power2.out' },
    '-=0.1')
  tl.fromTo('.scroll-indicator',
    { opacity: 0 },
    { opacity: 1, duration: 0.25 })

  // Background slideshow (Ken Burns crossfade)
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches
  const imgs = [...document.querySelectorAll('.hero-img')]
  if (imgs.length && !reduced) {
    imgs[0].classList.add('ken-burns')
    let current = 0
    setInterval(() => {
      const prev = current
      current = (current + 1) % imgs.length
      imgs[prev].style.opacity = '0'
      imgs[prev].classList.remove('ken-burns')
      imgs[current].style.opacity = '1'
      imgs[current].classList.add('ken-burns')
    }, 5000)
  }

  // Scroll-out parallax
  if (!reduced) {
    gsap.timeline({
      scrollTrigger: {
        trigger: '#home',
        start: 'top top',
        end: 'bottom top',
        scrub: true,
      },
    })
      .to('.hero-bg', { yPercent: 16, ease: 'none' }, 0)
      .to('.hero-content', { yPercent: -26, opacity: 0, filter: 'blur(6px)', ease: 'none' }, 0)
      .to('.hero-scrim', { opacity: 0.55, ease: 'none' }, 0)
      .to('.scroll-indicator', { opacity: 0, ease: 'none' }, 0)
  }
</script>

</body>
</html>
